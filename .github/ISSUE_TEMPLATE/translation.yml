name: Translation
description: Paste a translated Locales file, or the lines you corrected, and I'll add it.
labels: [enhancement]
body:
  - type: dropdown
    id: locale
    attributes:
      label: Locale
      options:
        - deDE
        - esES
        - esMX
        - frFR
        - koKR
        - ptBR
        - ruRU
        - zhCN
        - zhTW
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Locales file
      description: >-
        Your copy of `Locales/phrases.txt` with the right-hand sides translated, or just the lines you corrected in
        `Locales/<locale>.lua`. Lines you leave out stay as they are.
      render: lua
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything worth knowing, such as phrases you weren't sure about.
